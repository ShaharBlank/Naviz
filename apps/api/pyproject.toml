[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "naviz-api"
version = "0.2.0"
description = "Naviz metropolitan Tel Aviv navigation API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "astral>=3.2,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyproj>=3.7,<4",
  "python-jose[cryptography]>=3.5,<4",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "shapely>=2.1,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
data = [
  "astral>=3.2,<4",
  "numpy>=2.2,<3",
  "pyproj>=3.7,<4",
  "scipy>=1.15,<2",
  "shapely>=2.1,<3",
]
postgres = ["geoalchemy2>=0.17,<1"]
dev = [
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naviz_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["naviz_api"]
