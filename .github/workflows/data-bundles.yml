name: Data bundle validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
      - run: uv sync --frozen --package naviz-data
      - run: uv run --package naviz-data python -m naviz_data.cli validate artifacts/demo
      - name: Explain publication boundary
        run: >-
          echo "Source downloads and artifact publication require separately configured,
          licensed workflow credentials; request-serving containers never invoke them."
