name: Data bundle validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen --package naviz-data
      - run: uv run --package naviz-data python -m naviz_data.cli validate artifacts/demo
      - name: Fetch and validate pinned nationwide OSM feature bundle
        run: >-
          uv run --package naviz-data python -m naviz_data.artifact_fetch
          infra/data-bundles/israel-osm-features-2026-08-16.json
          $RUNNER_TEMP/israel-osm-features.sqlite3
