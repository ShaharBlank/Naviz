name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src packages/data_pipeline/naviz_data
      - run: >-
          uv run pytest --cov=naviz_api --cov=naviz_data
          --cov-report=term-missing --cov-report=xml
      - name: Validate pinned demo bundle
        run: uv run python -m naviz_data.cli validate artifacts/demo
      - name: Verify checked-in OpenAPI contract
        run: uv run python scripts/export_openapi.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run contract:generate
      - name: Verify generated TypeScript contract is current
        run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx expo install --check
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist/android-bundle

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install cyclonedx-bom pip-audit
      - run: python -m pip install './apps/api[data,postgres]' ./packages/data_pipeline
      - run: pip-audit
      - run: cyclonedx-py environment --output-file sbom-python.json
      - run: npm ci
        working-directory: apps/mobile
      - name: Report high-severity mobile dependency findings
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/mobile
      - name: Block critical mobile dependency findings
        run: npm audit --omit=dev --audit-level=critical
        working-directory: apps/mobile
      - name: Generate mobile SBOM
        run: npm sbom --sbom-format cyclonedx > ../../sbom-mobile.json
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: software-bills-of-materials
          path: |
            sbom-python.json
            sbom-mobile.json
