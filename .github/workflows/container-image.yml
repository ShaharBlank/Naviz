name: Backend container image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-image.yml"
      - "apps/api/**"
      - "artifacts/demo/**"
      - "infra/Dockerfile"
      - "packages/data_pipeline/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/shaharblank/naviz-api:latest
            ghcr.io/shaharblank/naviz-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ShaharBlank/Naviz
            org.opencontainers.image.revision=${{ github.sha }}
