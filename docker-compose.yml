services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      PORT: 8000
      NAVIZ_ENV: development
      NAVIZ_DATA_BUNDLE: demo-2026-08-02
      NAVIZ_DATABASE_URL: postgresql+asyncpg://naviz:naviz@postgres:5432/naviz
      NAVIZ_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: naviz
      POSTGRES_USER: naviz
      POSTGRES_PASSWORD: naviz
    ports:
      - "5432:5432"
    volumes:
      - naviz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naviz -d naviz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naviz-postgres:
